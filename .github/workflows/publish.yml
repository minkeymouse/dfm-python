name: Publish to PyPI

# Pushing a tag such as v0.8.0 builds the sdist and wheel and uploads them to
# PyPI with Trusted Publishing (no API token is stored in the repository).
# One-time setup on pypi.org: project dfm-python -> Manage -> Publishing ->
# add a GitHub publisher with owner "minkeymouse", repository "dfm-python",
# workflow "publish.yml" and environment "pypi".

#
# Either push a v* tag, or create a GitHub Release (Releases -> Draft a new
# release -> new tag v0.8.0 on main -> Publish). If both events fire for the
# same version, the second upload is skipped.
#
# A manual run (Actions -> Publish to PyPI -> Run workflow) is accepted only on
# main; on any other branch the build job is skipped and nothing is uploaded.
#
# Supply chain: every action is pinned to a full commit SHA (Dependabot keeps
# the pins current, see .github/dependabot.yml), checkouts do not keep the
# GITHUB_TOKEN in .git/config, and the release build runs without the uv cache.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uvx twine@7.0.0 check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dfm-python
    permissions:
      id-token: write  # Trusted Publishing: mint the short-lived PyPI upload token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true

  # A manual run (workflow_dispatch) on main has no tag yet: after the upload
  # succeeds, tag the commit as v<version> and create the GitHub Release.
  # Runs started by a tag push or a published release already have both.
  github-release:
    needs: publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the v<version> tag and the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          tag="v${version}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists"
            exit 0
          fi
          awk -v v="## ${version}" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          gh release create "${tag}" dist/* --target "${GITHUB_SHA}" \
            --title "dfm-python ${version}" --notes-file notes.md
