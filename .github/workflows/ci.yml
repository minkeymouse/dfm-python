name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs; Dependabot (.github/dependabot.yml) bumps them.
permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # Installs the locked dependency set (default PyPI torch wheel) plus every
      # optional extra, since some tests import optuna, omegaconf, sktime, polars.
      - name: Install dependencies
        run: uv sync --locked --group dev --all-extras
      - name: Run tests
        run: uv run --no-sync pytest src/test -q

  # Smoke run of every tutorial/ script on truncated data with one EM iteration
  # or training epoch (about 30 s on CPU). Each script fits, forecasts, saves to
  # $RUNNER_TEMP and reloads; a non-zero exit fails the job.
  tutorials:
    runs-on: ubuntu-latest
    env:
      DFM_TUTORIAL_MAX_ITER: "1"
      DFM_TUTORIAL_MAX_EPOCHS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group dev --all-extras
      - name: Run the tutorials
        shell: bash
        run: |
          set -euo pipefail
          scripts=(tutorial/tutorial_*.py)
          if [ "${#scripts[@]}" -ne 9 ]; then
            echo "expected 9 tutorial scripts, found ${#scripts[@]}"
            exit 1
          fi
          for script in "${scripts[@]}"; do
            name=$(basename "$script" .py)
            # 120 rows each; 400 for the weekly-clock macro DFM, so its monthly series keep ~90 observations.
            rows=120
            if [ "$name" = tutorial_macro_dfm ]; then rows=400; fi
            args=(--run-dir "$RUNNER_TEMP/$name")
            case "$name" in
              *_ddfm|*_ivdfm) args+=(--device cpu) ;;
            esac
            echo "::group::$name (rows=$rows)"
            DFM_TUTORIAL_ROWS=$rows uv run --no-sync python "$script" "${args[@]}"
            echo "::endgroup::"
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
      # Same ruff version as uv.lock and .pre-commit-config.yaml.
      - name: ruff check
        run: uvx ruff@0.17.1 check .
      # The codebase has not been run through the formatter yet, so this step
      # reports but does not fail the build. Make it blocking once formatted.
      - name: ruff format --check (non-blocking)
        continue-on-error: true
        run: uvx ruff@0.17.1 format --check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uvx twine@7.0.0 check dist/*
