[project]
name = "dfm-python"
version = "0.8.3"
description = "Dynamic Factor Model (DFM) estimation and forecasting in Python"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Minkey Chang"}
]
keywords = ["dfm", "dynamic-factor-model", "forecasting", "time-series", "econometrics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.10.0",
    "threadpoolctl>=3.1.0",  # single-threaded BLAS inside the Kalman loops
]

[project.optional-dependencies]
# DDFM, iVDFM and AFM (the torch models); DFM needs none of it
deep = [
    "einops>=0.8.1",
    "torch>=2.10.0",  # 2.10 fixes CVE-2026-24747 in the weights_only=True unpickler used by load()
]
# iVDFM hyperparameter search (dfm_python.tuning)
tune = [
    "optuna>=4.7.0",
]
# Loading configurations from YAML files or OmegaConf DictConfig objects
yaml = [
    "omegaconf>=2.3.0",
]
# calculate_rmse / calculate_mae (dfm_python.utils.metric)
metrics = [
    "sktime>=0.40.1",
]
# Passing polars DataFrames to the dataset classes (conversion to pandas needs pyarrow)
polars = [
    "polars>=1.0.0",
    "pyarrow>=22.0.0",
]
all = [
    "dfm-python[deep,tune,yaml,metrics,polars]",
]
# Keep in sync with [dependency-groups].dev below.
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "build>=1.4.0",
    "twine>=7.0.0",  # 6.x rejects Metadata-Version 2.5 wheels built by current hatchling
    # imported directly by the test suite
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "optuna>=4.7.0",
    # independent Kalman smoother for the DFM E-step oracle tests
    "statsmodels>=0.14.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]  # bounded: the release build resolves the backend from PyPI, not uv.lock
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Prevent automatic license-file field addition
allow-direct-references = false
allow-license-file = false

[tool.hatch.build.targets.wheel]
packages = [
    "src/dfm_python",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "test_venv",
    "test_venv/**",
    "data/**",
    "uv.lock",
]

[dependency-groups]
# Development tooling (`uv sync` installs this group by default; pip >= 25.1
# installs it with `pip install --group dev`). Listed literally rather than as
# "dfm-python[dev]", because pip would resolve that name from PyPI instead of
# the local tree. Keep in sync with the `dev` extra above.
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "build>=1.4.0",
    "twine>=7.0.0",  # 6.x rejects Metadata-Version 2.5 wheels built by current hatchling
    # imported directly by the test suite
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "optuna>=4.7.0",
    # independent Kalman smoother for the DFM E-step oracle tests
    "statsmodels>=0.14.0",
]

[project.urls]
Homepage = "https://github.com/minkeymouse/dfm-python"
Documentation = "https://github.com/minkeymouse/dfm-python#readme"
Repository = "https://github.com/minkeymouse/dfm-python"
Issues = "https://github.com/minkeymouse/dfm-python/issues"

[tool.ruff]
# Most of the codebase fits in 120 columns; this keeps the formatter's churn smallest.
line-length = 120
target-version = "py310"
extend-exclude = ["data", "outputs"]

[tool.ruff.lint]
# Lenient starter set. The ignores below silence rules that fire hundreds of
# times on existing code; they will be tightened step by step later.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "I001",   # unsorted-imports: re-sorting breaks circular imports between subpackages
    "E402",   # module-import-not-at-top-of-file (deliberate lazy/conditional imports)
    "E501",   # line-too-long (left to the formatter)
    "E701",   # multiple-statements-on-one-line-colon
    "E702",   # multiple-statements-on-one-line-semicolon
    "E722",   # bare-except
    "E731",   # lambda-assignment
    "E741",   # ambiguous-variable-name (math notation such as `l`, `I`)
    "W291",   # trailing-whitespace (mostly inside docstrings)
    "W293",   # blank-line-with-whitespace (mostly inside docstrings)
    "UP006",  # non-pep585-annotation (typing.List -> list)
    "UP007",  # non-pep604-annotation-union (Union[X, Y] -> X | Y)
    "UP035",  # deprecated-import (typing.List etc.)
    "UP045",  # non-pep604-annotation-optional (Optional[X] -> X | None)
    "B007",   # unused-loop-control-variable
    "B023",   # function-uses-loop-variable
    "B024",   # abstract-base-class-without-abstract-method
    "B027",   # empty-method-without-abstract-decorator
    "B904",   # raise-without-from-inside-except
    "B905",   # zip-without-explicit-strict
]

[tool.pytest.ini_options]
testpaths = ["src/test"]
