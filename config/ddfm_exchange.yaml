# DDFM Configuration for Exchange Rate Dataset
# Based on original TensorFlow DDFM implementation (DDFM/run_exchange_rate_original.py)
# Data: 8 exchange rate series (AUD_USD, GBP_USD, CAD_USD, CHF_USD, CNY_USD, JPY_USD, SGD_USD, NZD_USD)
# Clock: Daily (d) - all series are daily frequency
# Date range: 1990-01-01 to 2010-10-10

# Neural Network Architecture (matching original TensorFlow DDFM)
encoder_layers: [16, 4]  # Hidden layers: [16] -> latent: 4 (matching original structure_encoder=(16, 4))
activation: relu  # Matching original link='relu'
use_batch_norm: true  # Matching original batch_norm=True

# Training Parameters
# NOTE: for fair comparison with iVDFM exchange tutorial/config, we align the
# effective window length and training budget (see ivdfm_exchange.yaml).
learning_rate: 0.005
n_mc_samples: 10
window_size: 200  # Align with iVDFM sequence_length=200

# MCMC/Iterative Parameters
# NOTE: DDFM uses max_epoch as an iteration budget; iVDFM uses max_epochs.
# We set this to 10 here to make the tutorials comparable in runtime budget.
max_epoch: 10
tolerance: 0.0005
disp: 10
seed: 3

# Interpolation Parameters
interpolation_method: linear  # Interpolation method for missing values
interpolation_limit: 10  # Maximum consecutive NaNs to interpolate
interpolation_limit_direction: both  # Direction to fill ('forward', 'backward', or 'both')

# Data Handling (used by Dataset, not Model)
clock: d  # Daily clock frequency (all series are daily)
scaler: null  # No scaler - data should be pre-scaled before passing to Dataset
