# DFM on the coded financial indicators (data/finance.csv): 26 indicators
# (D, E, I, M, P, S and V series) and the target market_forward_excess_returns,
# in four blocks of two factors each, on a daily clock.
#
#   from dfm_python import DFM, PanelData
#   from dfm_python.config import DFMConfig, load_yaml
#   sections = load_yaml("config/dfm_finance.yaml")
#   df["date"] = pd.date_range("1980-01-01", periods=len(df), freq="D")
#   data = PanelData.from_wide(df, **sections["data"])
#   model = DFM.from_config(DFMConfig.from_dict(sections["model"]))
#
# finance.csv has no dates (only date_id = 0, 1, ...), so the tutorial adds a
# daily 'date' column starting 1980-01-01, as the old tutorial did.
#
# The model: section holds DFM's constructor parameters and is exactly what
# runs. No value changes from the flat file of earlier releases. Renamed:
# threshold -> tol and num_factors (in a block) -> n_factors. The flat file's
# scaler was not read by the old config; the tutorial passed StandardScaler,
# which is scaler: standard here.
#
# The series are the union of the blocks' series (Block_ALL holds them all),
# in the CSV's column order. The old tutorial selected the same series but
# ordered them by iterating over a Python set, an order that changes with the
# string hash seed from one run to the next; the order of the series and
# of the blocks is now fixed by this file.
model:
  blocks:
    Block_ALL:
      n_factors: 2
      series: [E1, E5, E10, E15, E20, I1, I5, I9, M1, M5, M10, M15, M18, D1, D5, D9,
               P1, P5, P10, P13, S1, S5, S10, V1, V5, V10, market_forward_excess_returns]
    Block_EI:
      n_factors: 2
      series: [E1, E5, E10, E15, E20, I1, I5, I9]
    Block_MD:
      n_factors: 2
      series: [M1, M5, M10, M15, M18, D1, D5, D9]
    Block_PSV:
      n_factors: 2
      series: [P1, P5, P10, P13, S1, S5, S10, V1, V5, V10, market_forward_excess_returns]
  clock: d
  max_iter: 10                   # EM iterations
  tol: 1.0e-5                    # EM convergence threshold
  scaler: standard

# PanelData.from_wide arguments (all series daily, at the clock frequency).
data:
  time_col: date
  y: [D1, D5, D9, E1, E10, E15, E20, E5, I1, I5, I9, M1, M10, M15, M18, M5,
      P1, P10, P13, P5, S1, S10, S5, V1, V10, V5, market_forward_excess_returns]
