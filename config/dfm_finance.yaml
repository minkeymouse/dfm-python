# DFM Configuration for Financial Datasets
# Based on coded financial indicators (D, E, I, M, P, S, V series)
# Data: 97 series (D1-D9, E1-E20, I1-I9, M1-M18, P1-P13, S1-S12, V1-V13, plus targets)
# Target: market_forward_excess_returns
# Excluded: risk_free_rate, forward_returns
# Reduced series for testing purposes

# EM Algorithm Parameters
threshold: 1.0e-05  # EM convergence threshold
max_iter: 50  # Maximum EM iterations

# Data Handling
clock: d  # Daily clock frequency (finance.csv uses daily index via date_id)
scaler: standard  # Scaler for all series: 'standard', 'robust', 'minmax', 'maxabs', 'quantile', or null
# Note: scaler is handled internally by the model, not set on config object
# Note: nan_method and nan_k are internal constants (not user-configurable)

# Block Structure for Financial Data (testing configuration)
# 4 blocks, 2 factors per block (reduced from 3 for faster testing)
# This still verifies all block mechanisms while reducing state dimension
blocks:
  Block_ALL:
    num_factors: 2  # Reduced from 3 for faster testing
    series:
      # Contains all series from Block_EI, Block_MD, and Block_PSV
      # From Block_EI:
      - E1
      - E5
      - E10
      - E15
      - E20
      - I1
      - I5
      - I9
      # From Block_MD:
      - M1
      - M5
      - M10
      - M15
      - M18
      - D1
      - D5
      - D9
      # From Block_PSV:
      - P1
      - P5
      - P10
      - P13
      - S1
      - S5
      - S10
      - V1
      - V5
      - V10
      - market_forward_excess_returns

  Block_EI:
    num_factors: 2  # Reduced from 3 for faster testing
    series:
      # E series: ~6 series
      - E1
      - E5
      - E10
      - E15
      - E20
      # I series: ~4 series
      - I1
      - I5
      - I9

  Block_MD:
    num_factors: 2  # Reduced from 3 for faster testing
    series:
      # M series: ~6 series
      - M1
      - M5
      - M10
      - M15
      - M18
      # D series: ~4 series
      - D1
      - D5
      - D9

  Block_PSV:
    num_factors: 2  # Reduced from 3 for faster testing
    series:
      # P series: ~4 series
      - P1
      - P5
      - P10
      - P13
      # S series: ~3 series
      - S1
      - S5
      - S10
      # V series: ~3 series
      - V1
      - V5
      - V10
      - market_forward_excess_returns

# Frequency mapping: Not required for single-frequency cases
# The code will automatically create frequency dict from data columns using clock frequency (d)
