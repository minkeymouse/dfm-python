# Default Preprocessing Configuration
# NOTE: This is a standalone preprocessing config template.
# In the new unified structure, preprocessing is embedded in experiment configs under preprocess.metadata and preprocess.series.
# This file is kept for reference and backward compatibility.

# Metadata section (maps to preprocess.metadata in experiment configs)
metadata:
  data_path: data/sample_data.csv
  target_column: null
  # Window Summarizer features
  add_feature:
    - lag
    - mean
    - std
    - min
    - max
    - median
    - skew
    - kurt
  lags: [1, 2, 3, 5, 10]
  windows: [5, 10, 20, 40]

# Series section (maps to preprocess.series in experiment configs)
series: []
# Example:
# series:
#   - series_id: KO3YEARC
#     frequency: m
#     transformation: chg
#     block: [Block_Global, Block_Investment]
#     release: 1
#     scaler: null  # StandardScaler, RobustScaler, None/null
#     impute: null  # bfill, ffill, forecaster, dfm, ddfm, null

description: "Default preprocessing template - metadata and series structure"
