# iVDFM Configuration for Exchange Rate Dataset
# Data: 8 exchange rate series (AUD_USD, GBP_USD, CAD_USD, CHF_USD, CNY_USD, JPY_USD, SGD_USD, NZD_USD)
# Clock: Daily (d) - all series are daily frequency
# Date range: 1990-01-01 to 2010-10-10

# ===== Model Structure =====
# Latent dimension
num_factors: 2
sequence_length: 200  # Sequence length for sliding windows
context: null  # Column names (DataFrame) or indices (array) for context variables. If None, time-based context is generated.
context_dim: 1  # Dimension of context. Used when context is None (generates time-based context) or when context is multivariate.

# ===== Neural Network Architecture =====
encoder_hidden_dim: 200  # Encoder hidden dimension
encoder_n_layers: 3  # Number of encoder layers
decoder_hidden_dim: 200  # Decoder hidden dimension
decoder_n_layers: 3  # Number of decoder layers
prior_hidden_dim: 100  # Prior network hidden dimension
prior_n_layers: 2  # Number of prior network layers
activation: lrelu  # Activation function: 'relu', 'lrelu', 'tanh', 'sigmoid'
slope: 0.1  # Leaky ReLU slope

# ===== Dynamics and Distribution Parameters =====
factor_order: 1  # AR order for factors (p in AR(p))
innovation_distribution: laplace  # Innovation distribution: 'laplace', 'gaussian', 'student_t'
decoder_var: 0.01  # Decoder variance (observation noise)

# ===== Training Parameters =====
learning_rate: 0.001  # Learning rate for optimizer
optimizer: Adam  # Optimizer type: 'Adam', 'AdamW', 'SGD'
batch_size: 256  # Batch size for training (larger to reduce #batches/epoch)
max_epochs: 10  # Maximum training epochs
tolerance: 1.0e-5  # Convergence tolerance
seed: null  # Random seed (None uses default)

# ===== Base Model Config (inherited) =====
frequency: null  # iVDFM doesn't use mixed-frequency structure
clock: d  # Daily clock frequency (all series are daily)
scaler: null  # Scaler for targets: 'standard', 'robust', 'minmax', 'maxabs', 'quantile', or null. Applied to targets only (not context/auxiliary variables)
