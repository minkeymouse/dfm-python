# iVDFM on the daily exchange rates (data/exchange_rate.csv, 1990-01-01 to 2010-10-10).
#
#   from dfm_python import iVDFM, PanelData
#   from dfm_python.config import iVDFMConfig, load_yaml
#   sections = load_yaml("config/ivdfm_exchange.yaml")
#   data = PanelData.from_wide(df, **sections["data"])
#   model = iVDFM.from_config(iVDFMConfig.from_dict(sections["model"]))
#
# The model: section holds iVDFM's constructor parameters and is exactly what
# runs. Earlier releases let constructor defaults override some values of this
# file; these values now take effect and differ from what ran before:
#   encoder_n_hidden_layers: 3   (ran as 2)
#   decoder_n_hidden_layers: 3   (ran as 2)
#   prior_n_hidden_layers: 2     (ran as 1)
#   tol: 1.0e-5                  (ran as 5.0e-4)
#
# All eight series are targets and there are no exog columns: the context u_t
# is the generated time feature (time_context=1, the default).
model:
  # Latent structure
  n_factors: 2
  window: 200                    # sliding-window length; stride=None means window // 2
  factor_order: 1                # AR order p of the factor dynamics
  innovation_distribution: laplace
  decoder_var: 0.01

  # Networks
  encoder_hidden_dim: 200
  encoder_n_hidden_layers: 3
  decoder_hidden_dim: 200
  decoder_n_hidden_layers: 3
  prior_hidden_dim: 100
  prior_n_hidden_layers: 2
  activation: lrelu
  slope: 0.1

  # Training
  learning_rate: 0.001
  optimizer: Adam
  batch_size: 256
  max_epochs: 10
  tol: 1.0e-5
  scaler: null                   # the rates are used as given
  random_state: 3

# PanelData.from_wide arguments.
data:
  time_col: date
  y: [AUD_USD, GBP_USD, CAD_USD, CHF_USD, CNY_USD, JPY_USD, SGD_USD, NZD_USD]
  exog: []
