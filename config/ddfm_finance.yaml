# DDFM Configuration for Finance Dataset
# Data: Finance data with market_forward_excess_returns as target variable
# Clock: Monthly (m) - all series are monthly frequency

# Neural Network Architecture
# Match iVDFM depth/width more closely: 3 hidden layers of size ~200
encoder_layers: [64, 32, 5]  # Hidden layers: [200, 200] -> latent: 5 factors (match iVDFM capacity)
activation: relu  # Activation function: 'tanh', 'relu', 'sigmoid'
use_batch_norm: true  # Use batch normalization
decoder_type: mlp  # Use non-linear (MLP) decoder instead of linear

# Target/covariate split
# For DDFM finance: covariates are ALL columns except the target.
target_col: market_forward_excess_returns
covariates: all_except_target

# Training Parameters
learning_rate: 0.001  # Learning rate for optimizer
n_mc_samples: 10  # Number of MC samples per MCMC iteration
window_size: 200  # Align with iVDFM sequence_length=200

# MCMC/Iterative Parameters
max_epoch: 10  # Align with iVDFM max_epochs=10
tolerance: 0.0005  # Convergence tolerance
disp: 10  # Display frequency for training progress
seed: null  # Random seed (None uses default)

# Interpolation Parameters
interpolation_method: linear  # Interpolation method for missing values
interpolation_limit: 10  # Maximum consecutive NaNs to interpolate
interpolation_limit_direction: both  # Direction to fill ('forward', 'backward', or 'both')

# Data Handling (used by Dataset, not Model)
clock: m  # Monthly clock frequency
scaler: standard  # Scaler for target series: 'standard', 'robust', 'minmax', 'maxabs', 'quantile', or null


