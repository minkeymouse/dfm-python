# iVDFM on the finance panel (data/finance.csv), forecasting market_forward_excess_returns.
#
#   from dfm_python import iVDFM, PanelData
#   from dfm_python.config import iVDFMConfig, load_yaml
#   sections = load_yaml("config/ivdfm_finance.yaml")
#   data = PanelData.from_wide(df, **sections["data"])
#   model = iVDFM.from_config(iVDFMConfig.from_dict(sections["model"]))
#
# finance.csv has no date column (only date_id); the tutorial adds a daily
# 'date' column starting 1980-01-01.
#
# The model: section holds iVDFM's constructor parameters and is exactly what
# runs. Earlier releases let constructor defaults override some values of this
# file; these values now take effect and differ from what ran before:
#   encoder_hidden_dim: 50       (ran as 200)
#   decoder_hidden_dim: 50       (ran as 200)
#   factor_order: 2              (ran as 1)
#   prior_n_hidden_layers: 2     (ran as 1)
#   tol: 1.0e-5                  (ran as 5.0e-4)
#
# The other columns were never part of the model (neither targets nor context),
# so there are no exog columns: the context u_t is the generated time feature
# (time_context=1, the default).
#
# n_factors (5) exceeds the single target. The AR coefficients are initialized by OLS
# on the PCA factors of the last window; the factors beyond the number of
# targets keep the engine's default random initialization.
model:
  # Latent structure
  n_factors: 5                   # may exceed the number of targets
  window: 200                    # sliding-window length; stride=None means window // 2
  factor_order: 2                # AR order p of the factor dynamics
  innovation_distribution: laplace
  decoder_var: 0.01

  # Networks
  encoder_hidden_dim: 50
  encoder_n_hidden_layers: 2
  decoder_hidden_dim: 50
  decoder_n_hidden_layers: 2
  prior_hidden_dim: 100
  prior_n_hidden_layers: 2
  activation: lrelu
  slope: 0.1

  # Training
  learning_rate: 0.001
  optimizer: Adam
  batch_size: 128
  max_epochs: 10
  tol: 1.0e-5
  scaler: standard               # targets only; forecasts are returned in data units
  random_state: 3

# PanelData.from_wide arguments.
data:
  time_col: date
  y: [market_forward_excess_returns]
  exog: []
