# DDFM on the Korean macro panel (data/macro.csv, weekly dates 1985-04-05 to 2025-11-21),
# forecasting KOEQUIPTE (investment, equipment) with the other series as encoder covariates.
#
#   from dfm_python import DDFM, PanelData
#   from dfm_python.config import DDFMConfig, load_yaml
#   sections = load_yaml("config/ddfm_macro.yaml")
#   data = PanelData.from_wide(df, **sections["data"])
#   model = DDFM.from_config(DDFMConfig.from_dict(sections["model"]))
#
# The model: section holds DDFM's constructor parameters and is exactly what
# runs. Earlier releases ignored this file when it was passed as
# DDFM(dataset, config=...) (only the interpolation values were read); these
# values now take effect and differ from what such a run used:
#   learning_rate: 0.001         (ran as 0.005)
#   n_mc_samples: 1              (ran as 10)
#   encoder_layers: [64, 32]     (ran as [16])
#   n_factors: 2                 (ran as 4; the old encoder_layers [64, 32, 2] ended with it)
#
# The old tutorial passed the values explicitly, so for it only random_state: 3
# differs (it ran unseeded from seed: null). scaler: standard is the
# StandardScaler the tutorial used. The never-read use_batch_norm and disp, and
# the data settings clock and frequency, are gone: the target and covariates
# are in the data: section.
model:
  # Network
  n_factors: 2                   # latent factors (the encoder's output width)
  encoder_layers: [64, 32]       # encoder hidden widths
  decoder_type: linear
  activation: relu

  # Training
  learning_rate: 0.001
  optimizer: Adam
  n_mc_samples: 1                # MC samples per MCMC iteration (and pre-training epochs)
  window_size: 100               # time steps per training batch
  max_iter: 200                  # MCMC iterations
  tol: 5.0e-4
  interpolation_method: linear
  interpolation_limit: 10
  interpolation_limit_direction: both
  scaler: standard               # targets (covariates get a fresh scaler of the same class)
  random_state: 3

# PanelData.from_wide arguments. The exog columns are the encoder's covariates,
# in this order (the CSV's), ahead of the target.
data:
  time_col: date
  y: [KOEQUIPTE]
  exog: [KORFBEV, KORWHLS, KORMCMP, KORELEC, KORCNST, KORMACH, KOROCOINF, KOEMPTOTO, KOHWRWEMP,
         KOWRCDURE, KOCONPRCF, KOWRCCNSE, KOIMPCONA]
