# DDFM Configuration
# Note: DDFM does not use block structure - blocks are only for DFM
# num_factors specifies the total number of factors directly

clock: m
nan_k: 3
nan_method: 2

# Neural network architecture
encoder_layers:
- 64
- 32
num_factors: 2
activation: tanh
use_batch_norm: true

# Training parameters
learning_rate: 0.001
batch_size: 32
epochs: 100
factor_order: 1

# MCMC parameters
max_iter: 200
tolerance: 0.0005
disp: 10

# Idiosyncratic components
use_idiosyncratic: true
min_obs_idio: 5
