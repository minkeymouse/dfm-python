# XGBoost Model Configuration
# Gradient boosting model for time series forecasting

# XGBoost hyperparameters
n_estimators: 100
max_depth: 6
learning_rate: 0.1
subsample: 0.8
colsample_bytree: 0.8
min_child_weight: 1
gamma: 0
reg_alpha: 0
reg_lambda: 1

# Training parameters
early_stopping_rounds: 10
eval_metric: rmse
objective: reg:squarederror

# Time series specific
# Note: XGBoost requires feature engineering (lags, rolling stats) before training
# Use preprocessing configs to create features

