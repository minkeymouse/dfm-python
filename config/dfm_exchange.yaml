# DFM Configuration for Exchange Rate Datasets
# Clock: Daily (d) - base frequency for latent factors
# Data: Daily exchange rate data (all series at same frequency)

# EM Algorithm Parameters
# NOTE: Exchange tutorial is long daily data (T~7.6k). Full EM can take hours.
# Keep tutorial runs short by capping iterations and loosening convergence.
threshold: 1.0e-04  # EM convergence threshold (tutorial-friendly)
max_iter: 10  # Maximum EM iterations (tutorial-friendly)

# Data Handling
clock: d  # Daily clock frequency (base frequency for latent factors)
scaler: standard  # Scaler for all series: 'standard', 'robust', 'minmax', 'maxabs', 'quantile', or null
# Note: scaler is handled internally by the model, not set on config object
# Note: nan_method and nan_k are internal constants (not user-configurable)
num_factors: 2  # Number of factors


