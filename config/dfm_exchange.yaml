# DFM on the daily exchange rates (data/exchange_rate.csv, 1990-01-01 to 2010-10-10).
#
#   from dfm_python import DFM, PanelData
#   from dfm_python.config import DFMConfig, load_yaml
#   sections = load_yaml("config/dfm_exchange.yaml")
#   data = PanelData.from_wide(df, **sections["data"])
#   model = DFM.from_config(DFMConfig.from_dict(sections["model"]))
#
# The model: section holds DFM's constructor parameters and is exactly what
# runs. No value changes from the flat file of earlier releases. Renamed:
# threshold -> tol and num_factors -> n_factors (the size of the single global
# block used when blocks is not given). The flat file's scaler was not read by
# the old config; the tutorial passed StandardScaler, which is scaler: standard
# here. The series are long (about 7,600 days), so max_iter and tol keep
# tutorial runs short.
#
# All eight series are daily, at the clock frequency.
model:
  n_factors: 2                   # factors of the single global block
  clock: d
  max_iter: 10                   # EM iterations
  tol: 1.0e-4                    # EM convergence threshold
  scaler: standard

# PanelData.from_wide arguments.
data:
  time_col: date
  y: [AUD_USD, GBP_USD, CAD_USD, CHF_USD, CNY_USD, JPY_USD, SGD_USD, NZD_USD]
