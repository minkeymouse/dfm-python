# DFM on the Korean macro panel (data/macro.csv, 1985-04-05 to 2025-11-21):
# 7 weekly retail series and 7 monthly series (employment, hours, durable
# consumption, production, equipment and construction investment,
# consumption), on a weekly clock. A monthly series is observed on one week
# of its month and NaN on the others.
#
#   from dfm_python import DFM, PanelData
#   from dfm_python.config import DFMConfig, load_yaml
#   sections = load_yaml("config/dfm_macro.yaml")
#   data = PanelData.from_wide(df, **sections["data"])
#   model = DFM.from_config(DFMConfig.from_dict(sections["model"]))
#
# The model: section holds DFM's constructor parameters and is exactly what
# runs. No value changes from the flat file of earlier releases: this file
# runs the same model as the old DFM(dataset, config=...) with that file.
# Renamed: threshold -> tol, num_factors (in a block) -> n_factors, and the
# flat frequency mapping moved to data: freq (PanelData.freq). Gone, because
# the old config never read them: clip_ar_coefficients, ar_clip_min,
# ar_clip_max, use_regularization, regularization_scale, augment_idio,
# augment_idio_slow, idio_rho0 and idio_min_var (ar_clip and regularization
# ran as null, which is the default here), and the flat file's scaler, which
# the old config did not read either: the tutorial passed StandardScaler, which
# is scaler: standard here.
#
# A monthly series on a weekly clock needs the tent kernel of the monthly
# frequency (there is no default); one frequency slower than the clock is
# supported. The series may be in any column order: DFM orders them
# [weekly | monthly] internally and reports in the data's order.
model:
  blocks:
    Block_Global:
      n_factors: 3
      series: [KORFBEV, KORWHLS, KORMCMP, KORELEC, KORCNST, KORMACH, KOROCOINF,
               KOEMPTOTO, KOHWRWEMP, KOWRCDURE, KOCONPRCF, KOEQUIPTE, KOWRCCNSE, KOIMPCONA]
  clock: w                       # frequency of the latent factors
  tent_weights:
    m:w: [1, 2, 1]               # monthly series on the weekly clock
  max_iter: 10                   # EM iterations
  tol: 1.0e-5                    # EM convergence threshold
  scaler: standard

# PanelData.from_wide arguments.
data:
  time_col: date
  y: [KORFBEV, KORWHLS, KORMCMP, KORELEC, KORCNST, KORMACH, KOROCOINF,
      KOEMPTOTO, KOHWRWEMP, KOWRCDURE, KOCONPRCF, KOEQUIPTE, KOWRCCNSE, KOIMPCONA]
  freq:                          # {series: code}; unlisted series use the clock
    KORFBEV: w
    KORWHLS: w
    KORMCMP: w
    KORELEC: w
    KORCNST: w
    KORMACH: w
    KOROCOINF: w
    KOEMPTOTO: m
    KOHWRWEMP: m
    KOWRCDURE: m
    KOCONPRCF: m
    KOEQUIPTE: m
    KOWRCCNSE: m
    KOIMPCONA: m
