# DFM Configuration for Macroeconomic Datasets
# Based on Korean economic indicators (KO* series)
# Data: 101 series, mixed weekly/monthly frequency (1985-04-05 to 2025-11-21)
# Clock: Weekly (w) - base frequency for latent factors
# Target: KOEQUIPTE (Investment, Equipment, Estimation, SA)

# EM Algorithm Parameters
threshold: 1.0e-05  # EM convergence threshold
max_iter: 50  # Maximum EM iterations

# Numerical Stability Parameters
clip_ar_coefficients: true
ar_clip_min: -0.99
ar_clip_max: 0.99
use_regularization: true
regularization_scale: 1.0e-05

# Idiosyncratic Component Parameters
augment_idio: true
augment_idio_slow: true  # Important for mixed-frequency macro data (weekly clock, monthly indicators)
idio_rho0: 0.1
idio_min_var: 1.0e-08

# Data Handling
clock: w  # Weekly clock frequency (base frequency for latent factors)
scaler: standard  # Scaler for all series: 'standard', 'robust', 'minmax', 'maxabs', 'quantile', or null
# Note: scaler is handled internally by the model, not set on config object
# Note: nan_method and nan_k are internal constants (not user-configurable)

# Tent weights for mixed-frequency aggregation
# 3-period tent kernel for monthly->weekly aggregation
tent_weights:
  m:w: [1, 2, 1]  # 3-period tent kernel for monthly->weekly aggregation

# Block Structure for Macroeconomic Data
# Single global block for all series
# Series order: clock-frequency (weekly) first, then slower-frequency (monthly)
blocks:
  Block_Global:
    num_factors: 3  # Number of factors for global block
    series:
      # Weekly series (clock frequency) - must come first
      - KORFBEV  # Retail, Food & Beverages (weekly)
      - KORWHLS  # Retail, Wholesale (weekly)
      - KORMCMP  # Retail, Miscellaneous & Comparison (weekly)
      - KORELEC  # Retail, Electronics (weekly)
      - KORCNST  # Retail, Construction (weekly)
      - KORMACH  # Retail, Machinery (weekly)
      - KOROCOINF  # Retail, Other Consumer & Information (weekly)
      # Monthly series (slower than clock) - must come after clock-frequency series
      - KOEMPTOTO  # Total employment (monthly)
      - KOHWRWEMP  # Hours worked (monthly)
      - KOWRCDURE  # Durable goods consumption (monthly)
      - KOCONPRCF  # Production (monthly)
      - KOEQUIPTE  # Investment, Equipment (monthly, target series)
      - KOWRCCNSE  # Consumption (monthly, target series)
      - KOIMPCONA  # Investment, Construction (monthly, target series)

# Frequency mapping for mixed-frequency macro data
# Clock is weekly (w), so monthly series are slower frequency
# Grouped format: frequencies are specified as lists grouped by frequency code
frequency:
  # Monthly series (slower than weekly clock) - typically end-of-month observations
  # These are the series used in the tutorial
  m:
    - KOEMPTOTO  # Total employment (monthly)
    - KOHWRWEMP  # Hours worked (monthly)
    - KOWRCDURE  # Durable goods consumption (monthly)
    - KOCONPRCF  # Production (monthly)
    - KOEQUIPTE  # Investment, Equipment (monthly, target series)
    - KOWRCCNSE  # Consumption (monthly, target series)
    - KOIMPCONA  # Investment, Construction (monthly, target series)
  # Weekly series (same as clock frequency - these appear every week like the clock)
  # This is a mixed-frequency example: clock is weekly, but monthly series are slower
  # The tutorial now respects YAML frequencies for proper mixed-frequency handling
  # These weekly series are available in the data at clock frequency
  w:
    - KORFBEV  # Retail, Food & Beverages (weekly)
    - KORWHLS  # Retail, Wholesale (weekly)
    - KORMCMP  # Retail, Miscellaneous & Comparison (weekly)
    - KORELEC  # Retail, Electronics (weekly)
    - KORCNST  # Retail, Construction (weekly)
    - KORMACH  # Retail, Machinery (weekly)
    - KOROCOINF  # Retail, Other Consumer & Information (weekly)
